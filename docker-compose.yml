version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novaos
      POSTGRES_PASSWORD: novaos
      POSTGRES_DB: novaos
    ports:
      - "5432:5432"
    volumes:
      - novaos_pg_data:/var/lib/postgresql/data
volumes:
  novaos_pg_data:
